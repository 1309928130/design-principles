        <h2>Relate design principles to an event typology</h2>

        <p>Events are an important aspect of this research, as they are the causes of fluctuations in station areas and are a solution to solve emptiness. As part of the exploration of design solutions, we investigated the relationship between event types and design principles.</p>

        <!-- Define colors using HTML model -->
        <style>

            .color2 { color: #B99205; }

        <p>In this research, we adopted an event typology developed by <cite>Smith (2021)</cite>. This typology is framed based on access and mobility, including nine types of events: E1) large indoor arenas, E2) concerts and screenings, E3) pleasure gardens, E4) parades and street races, E5) roadshows, E6) markets and fairs, E7) mass gatherings, E8) micro-performances, and E9) marches and street parties. Two events - E4 and E9, primarily happen on streets, which are irrelevant for most spaces in railway stations, so we excluded (<strong>×</strong>) them (fig. <a href="#fig:eventtypology_principles" class="black-text">eventtypology_principles</a>).</p>

        <ul>
            <li>Large open-air events with concentrated distributions, including E2, E3, and E7, need large coherent outdoor spaces and should not block city passages. Therefore, these events have relevance to design principles (DPs)
                <a href="#dp11" class="black-text">(11) Adaptive redundant spaces with path regulation</a>,
                <a href="#dp7" class="black-text">(7) Human-oriented spaces</a>, and
                <a href="#dp20" class="black-text">(20 21) City passages and their positioning</a>.
                (Links: <span class="black-text">E2-D7, E3-D7, E6-D7; E7-D7; E2-D11, E3-D11, E6-D11, E7-D11; E2-D21, E3-D21, E6-D21, E7-D21)
            </li>

            <li>For large events with performances - E2,
                <a href="#dp24" class="black-text">(24) Stairs as stages or seats</a> can be used.
                (Link: <span class="color6">E2-D24</span>)
            </li>

            <li>Small spaces are common in a scattered layout (<a href="#dp4" class="black-text">D4</a>), and small events - E8 can be held in these small spaces.
                <a href="#dp15" class="black-text">(15) Flexible building components</a> can also be the small spaces to hold small events.
                (Links: <span class="color7">E8-D4, E8-D15</span>)
            </li>

            <li>For events that require user participation and are open-access, including E7, E5, E6, and E8, it is necessary to
                <a href="#dp6" class="black-text">(6) Make events visible by aligning main paths and open spaces</a>.
                (Links: <span class="color2">E7-D6, E5-D6, E6-D6, E8-D6</span>)
            </li>

            <li>Small performances and markets can help promote a vibrant environment, and it is a prerequisite to
                <a href="#dp23" class="black-text">(23) Reduce barriers to ease flow at the building level</a>.
                (Links: <span class="color5">E6-D23, E8-D23</span>)
            </li>

            <li>Large indoor arenas can be
                <a href="#dp14" class="black-text">Flexible buildings (14)</a>. Flexible and Shared use between arenas and stations can be realized if the station areas are
                <a href="#dp12" class="black-text">(12) Programmed considering the time dimension</a>.
                The arenas should be located in
                <a href="#dp2" class="black-text">Suitable general layouts of the station and city (2)</a>.
                (Links: <span class="color4">E1-D2, E1-D14, E1-D12</span>)
            </li>

            <li>In events E3 and E6, it is necessary to
                <a href="#dp16" class="black-text">(16) Add installations and facilities</a>, which can be
                <a href="#dp17" class="black-text">(17) Reconfigurable elements</a>.
                (Links: <span class="color8">E3-D11, E6-D11; E3-D16</span>)
            </li>

            <li>For all possible events happening in railway stations, the event spaces should support flexible use and be configurable, and pedestrians should be able to walk smoothly to the event spots. Therefore, several design principles are relevant, including
                <a href="#dp22" class="black-text">(22 23) Reduce barriers to ease flow at the district level</a>,
                <a href="#dp25" class="black-text">(25) City axes</a>,
                <a href="#dp1" class="black-text">(1) Flexible use</a>,
                <a href="#dp26" class="black-text">(26) Reconfigurable spaces</a>.
                (Links: <span class="color9">All-D25, All-D22, All-D26, All-D1</span>)
            </li>
        </ul>

  <script id="qualities-data" type="application/json">[{"name": "Human-oriented", "indices": ["7", "27"]}, {"name": "Reconfiguration", "indices": ["11", "13", "14", "15", "16", "17", "18", "19", "26"]}, {"name": "Scatteredness", "indices": ["2", "3", "4", "5"]}, {"name": "Event visibility", "indices": ["6", "24"]}, {"name": "Connection", "indices": ["8", "9", "10", "20", "21", "22", "23", "25"]}, {"name": "Flexible use", "indices": ["1", "12"]}]</script>
  <script>
    const { principles, dimensions } = JSON.parse(document.getElementById('principles-data').textContent);
    const qualityGroups = JSON.parse(document.getElementById('qualities-data').textContent);

    function principleCard(row) {
      const idx = row._idx;
      return `
        <div class="principle">
          <a href="detail/${idx}.html" target="_blank">
            <span class="index-number">${row.index}</span>
            <img src="static/${row.picture_location}" alt="Picture">
            <div class="tooltip"><p>${row.design_principle_name}</p></div>
          </a>
        </div>`;
    }

    function renderAll() {
      const container = document.getElementById('principles-container');
      container.innerHTML = principles.map(principleCard).join('');
    }

    function renderGrouped(dimension) {
      const container = document.getElementById('principles-container');
      const groups = new Map();
      principles.forEach((row) => {
        const key = row[dimension] || '(empty)';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(row);
      });
      container.innerHTML = [...groups.entries()].map(([title, rows]) => `
        <div class="row-container">
          <div class="row-title">${title}</div>
          <div class="principles-row">${rows.map(principleCard).join('')}</div>
        </div>
      `).join('');
    }

    function renderThemes() {
      const container = document.getElementById('principles-container');
      const themes = new Set();
      principles.forEach((row) => {
        (row['(Other) Themes'] || '').split('/').forEach((theme) => {
          const trimmed = theme.trim();
          if (trimmed) themes.add(trimmed);
        });
      });
      const html = [...themes].sort().map((theme) => {
        const rows = principles.filter((row) => (row['(Other) Themes'] || '').includes(theme));
        return `
          <div class="row-container">
            <div class="row-title">${theme}</div>
            <div class="principles-row">${rows.map(principleCard).join('')}</div>
          </div>`;
      }).join('');
      container.innerHTML = html;
    }

    function renderQualities() {
      const container = document.getElementById('principles-container');
      const byIndex = new Map(principles.map((row) => [String(row.index), row]));
      container.innerHTML = qualityGroups.map((group) => {
        const rows = group.indices
          .map((index) => byIndex.get(String(index)))
          .filter(Boolean);
        return `
          <div class="row-container">
            <div class="row-title">${group.name}</div>
            <div class="principles-row">${rows.map(principleCard).join('')}</div>
          </div>`;
      }).join('');
    }

    function renderPatterns() {
      document.getElementById('principles-container').innerHTML = `
        <div class="special-content">
          <img src="static/Pattern_Network_8M.png" alt="Patterns in a Network">
        </div>`;
    }

    function renderEventTypology() {
      const template = document.getElementById('event-typology-template');
      document.getElementById('principles-container').innerHTML = `
        <div class="special-content">
          <img src="static/event_principles.png" alt="Event Principles Image">
          ${template.innerHTML}
        </div>`;
    }

    function renderDimension(value) {
      if (!value || value === 'All') return renderAll();
      if (value === 'Qualities') return renderQualities();
      if (value === 'Patterns in a Network') return renderPatterns();
      if (value === 'Related to an Event Typology') return renderEventTypology();
      if (value === '(Other) Themes') return renderThemes();
      return renderGrouped(value);
    }

    document.getElementById('dimensionSelect').addEventListener('change', (event) => {
      renderDimension(event.target.value);
    });

    const params = new URLSearchParams(window.location.search);
    const selected = params.get('dimension') || '';
    if (selected) {
      document.getElementById('dimensionSelect').value = selected;
    }
    renderDimension(selected);
  </script>
